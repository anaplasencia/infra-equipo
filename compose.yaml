services:
  nginx_web:
    image: nginx:1.26-alpine
    container_name: nginx_web_s7
    ports:
      - "80:80"
    networks:
      - mi_red_s7
    volumes:
      - mi_volumen_s7:/usr/share/nginx/html

  base_datos:
    image: mysql:8.0.35
    container_name: mysql_bd_s7
    environment:
      MYSQL_ROOT_PASSWORD: anaevila_clave
    ports:
      - "3306:3306"
    networks:
      - mi_red_s7
    volumes:
      - datos_mysql_s7:/var/lib/mysql

networks:
  mi_red_s7:
    name: mi_red_s7

volumes:
  mi_volumen_s7:
    name: mi_volumen_s7
  datos_mysql_s7:
    name: datos_mysql_s7
